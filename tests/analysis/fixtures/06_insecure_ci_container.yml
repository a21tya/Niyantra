name: Insecure CI and Container Workflow
on:
  pull_request_target:
    types: [opened, synchronize]

permissions: write-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Untrusted PR
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build Container
        run: |
          docker run --privileged -v /var/run/docker.sock:/var/run/docker.sock -p 2375:2375 build-img
